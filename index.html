<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wayne | Technical Artist</title>
<style>
:root{
    --bg:#0f1117;
    --text:#e6edf3;
    --muted:#8b949e;
    --accent:#38bdf8;
    --card-bg:#161b22;
    --border:#30363d;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
}
html, body {
    min-height: 100%;
    display: flex;
    flex-direction: column;
}
body{
    background-color:var(--bg);
    background-image: url('./bg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color:var(--text);
    line-height:1.6;
    flex: 1;
    position: relative;
}
body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(15, 17, 23, 0.85);
    backdrop-filter: blur(40px) saturate(120%);
    -webkit-backdrop-filter: blur(40px) saturate(120%);
    z-index: -1;
}
/* 导航栏 */
nav{
    position:fixed;
    top:0;
    left:0;
    right:0;
    background:rgba(15,17,23,0.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom:1px solid rgba(255, 255, 255, 0.08);
    z-index:100;
    padding:1rem clamp(1rem,5vw,4rem);
}
.nav-content{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.nav-brand{
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
}
.brand-name{
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text);
}
.brand-subtitle{
    font-size: 1rem;
    font-weight: 400;
    color: var(--muted);
}
.nav-filter{
    display:flex;
    gap:0.5rem;
    background:rgba(22, 27, 34, 0.6);
    padding:0.25rem;
    border-radius:12px;
}
.nav-filter button{
    background:none;
    border:none;
    color:var(--muted);
    font-size:0.95rem;
    cursor:pointer;
    padding:0.5rem 1.25rem;
    border-radius:8px;
    transition:all 0.2s ease;
    font-weight:500;
}
.nav-filter button:hover{
    color:var(--text);
    background:rgba(255,255,255,0.05);
}
.nav-filter button.active{
    color:var(--text);
    background:var(--accent);
}
.nav-filter button:active{
    transform: scale(0.95);
}
/* 语言切换按钮 */
.lang-switch{
    display:flex;
    gap:0.5rem;
    background:rgba(22, 27, 34, 0.6);
    padding:0.25rem;
    border-radius:12px;
}
.lang-switch button{
    background:none;
    border:none;
    color:var(--muted);
    font-size:0.95rem;
    cursor:pointer;
    padding:0.5rem 1.25rem;
    border-radius:8px;
    transition:all 0.2s ease;
    font-weight:500;
}
.lang-switch button:hover{
    color:var(--text);
    background:rgba(255,255,255,0.05);
}
.lang-switch button.active{
    color:var(--text);
    background:var(--accent);
}
.lang-switch button:active{
    transform: scale(0.95);
}
.nav-right{
    display:flex;
    align-items:center;
    gap:0.75rem;
}
/* 首次访问语言选择弹窗 */
.lang-modal-overlay{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    z-index:2000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:1rem;
    animation:fadeIn 0.3s ease;
}
.lang-modal-overlay.active{
    display:flex;
}
.lang-modal{
    background:rgba(22,27,34,0.95);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;
    padding:2.5rem;
    max-width:420px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    animation:modalSlideIn 0.4s cubic-bezier(0.4,0,0.2,1);
}
.lang-modal h3{
    font-size:1.4rem;
    margin-bottom:0.75rem;
    color:var(--text);
}
.lang-modal p{
    color:var(--muted);
    font-size:0.95rem;
    margin-bottom:1.75rem;
    line-height:1.6;
}
.lang-modal-btns{
    display:flex;
    gap:1rem;
    justify-content:center;
}
.lang-modal-btns button{
    flex:1;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    color:var(--text);
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    padding:0.9rem 1rem;
    border-radius:12px;
    transition:all 0.2s ease;
}
.lang-modal-btns button:hover{
    background:var(--accent);
    border-color:var(--accent);
    color:#0f1117;
}
/* Hero 区域 */
.hero {
    display: none;
}
/* 主容器 */
.container{
    max-width:1200px;
    margin:0 auto;
    padding:6rem clamp(1rem,5vw,4rem) 4rem;
    flex: 1;
    width:100%;
    position: relative;
    z-index: 1;
}
/* 当前分类标题 */
.category-title{
    display: none;
}
/* 空状态提示 */
.empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 6rem 2rem;
    color: var(--muted);
    opacity: 0;
    animation: fadeIn 0.5s ease 0.2s forwards;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 50vh;
}
.empty-state h3 {
    font-size: 1.5rem;
    margin-bottom: 0.5rem;
    color: var(--text);
}
@keyframes fadeIn {
    to {
        opacity: 1;
    }
}
/* 项目列表 - 2列网格布局 */
.project-list{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.5rem;
}
/* 项目卡片 - 上下布局（图片在上，文字在下）- 苹果风格玻璃态 */
.project-item {
    background: rgba(22, 27, 34, 0.6);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 1;
    transform: translateY(0);
    position: relative;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
}
.project-item:hover {
    transform: translateY(-4px);
    border-color: rgba(56, 189, 248, 0.3);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(56, 189, 248, 0.1);
    background: rgba(22, 27, 34, 0.8);
}
.project-item::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 60px;
    background: linear-gradient(to bottom, transparent 0%, rgba(15,17,23,0.85) 100%);
    pointer-events: none;
    border-radius: 0 0 16px 16px;
    z-index: 1;
}
.project-item.hidden {
    opacity: 0;
    transform: translateY(-20px);
    pointer-events: none;
    height: 0;
    margin: 0;
    padding: 0;
    overflow: hidden;
}
.project-item.fade-in {
    animation: fadeInUp 0.5s ease forwards;
}
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
.project-item a {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    width: 100%;
    height: 100%;
}
.project-image-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16/10;
    overflow: hidden;
    background: var(--card-bg);
    flex-shrink: 0;
}
.project-image-wrapper::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 50%;
    background: linear-gradient(to bottom, transparent 0%, rgba(22, 27, 34, 0.6) 100%);
    pointer-events: none;
}
/* 项目标签 */
.project-tags {
    position: absolute;
    top: 1rem;
    left: 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    z-index: 2;
}
.project-tags .tag {
    padding: 0.35rem 0.75rem;
    background: rgba(22, 27, 34, 0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.02em;
}
.project-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #0d1117;
    opacity: 0;
    transition: opacity 0.3s ease;
}
.project-image.img-ready {
    opacity: 1;
}
/* 多图网格（始终位于 .project-image-wrapper 内，16:10 不变） */
.image-grid {
    position: absolute;
    inset: 0;
    display: grid;
    gap: 2px;
    background: #0d1117;
}
.image-grid.grid-1 {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
}
.image-grid.grid-2 {
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: 1fr;
}
.image-grid.grid-4 {
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
}
.image-grid.grid-9 {
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
}
/* 网格单元格 */
.project-image-cell {
    position: relative;
    overflow: hidden;
    background: #0d1117;
    transform-origin: center center;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.project-image-cell.empty {
    background: #0d1117;
}
/* 延时平滑放大：悬停格在原位连续缩放铺满图区（低于标签层 z-index:2），移开连续缩回 */
.project-image-cell.zoomed {
    z-index: 1;
}
/* 悬停放大覆盖层：以 wrapper 为基准显示完整图片（z-index 低于标签层的 2）*/
.zoom-overlay {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.35s ease;
    z-index: 1;
    pointer-events: none;
}
.zoom-overlay.active {
    opacity: 1;
    pointer-events: auto;   /* 激活后捕获鼠标，防止穿透到底层格子切图 */
}
.zoom-overlay img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.project-content {
    flex: 1;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}
.project-title {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    transition: color 0.3s ease;
}
.project-item:hover .project-title {
    color: var(--accent);
}
.project-desc {
    font-size: 0.95rem;
    color: var(--muted);
    line-height: 1.6;
}

/* 模态窗口 */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    animation: fadeIn 0.3s ease;
}
.modal-overlay.active {
    display: flex;
}
.modal-container {
    background: rgba(22, 27, 34, 0.95);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    width: 100%;
    max-width: 1000px;
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    animation: modalSlideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
}
@keyframes modalSlideIn {
    from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}
.modal-header {
    padding: 1.5rem 2rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
}
.modal-title {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--text);
}
.modal-close {
    width: 36px;
    height: 36px;
    border: none;
    background: rgba(255, 255, 255, 0.05);
    color: var(--muted);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    font-size: 1.5rem;
    line-height: 1;
}
.modal-close:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text);
}
.modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 2rem;
    position: relative;
}
.modal-body iframe {
    width: 100%;
    border: none;
    background: var(--bg);
    border-radius: 12px;
    min-height: 60vh;
    opacity: 0;
    transition: opacity 0.3s ease;
}
.modal-body iframe.loaded {
    opacity: 1;
}
/* 加载动画 */
.loading-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    z-index: 10;
    opacity: 1;
    transition: opacity 0.3s ease;
}
.loading-container.hidden {
    opacity: 0;
    pointer-events: none;
}
/* 圆形进度环 */
.loading-ring {
    width: 80px;
    height: 80px;
    position: relative;
    animation: breathe 2s ease-in-out infinite;
}
@keyframes breathe {
    0%, 100% {
        transform: scale(1);
        opacity: 1;
    }
    50% {
        transform: scale(1.1);
        opacity: 0.8;
    }
}
.loading-ring svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}
.loading-ring-bg {
    fill: none;
    stroke: rgba(56, 189, 248, 0.1);
    stroke-width: 4;
}
.loading-ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 251.2; /* 2 * PI * 40 */
    stroke-dashoffset: 251.2;
    transition: stroke-dashoffset 0.3s ease;
    filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
}
/* 无进度时的旋转环 */
.loading-spinner {
    width: 80px;
    height: 80px;
    position: relative;
    animation: breathe 2s ease-in-out infinite;
}
.loading-spinner svg {
    width: 100%;
    height: 100%;
    animation: rotate 2s linear infinite;
}
@keyframes rotate {
    100% {
        transform: rotate(360deg);
    }
}
.loading-spinner-circle {
    fill: none;
    stroke: var(--accent);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 80, 200;
    stroke-dashoffset: 0;
    filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
}
/* 加载文字 */
.loading-text {
    color: var(--accent);
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
    0%, 100% {
        opacity: 1;
    }
    50% {
        opacity: 0.5;
    }
}
/* 隐藏默认滚动条 */
.modal-body::-webkit-scrollbar {
    display: none;
}
.modal-body {
    -ms-overflow-style: none;
    scrollbar-width: none;
}
/* 自定义进度条 */
.scroll-progress {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: rgba(255, 255, 255, 0.05);
    z-index: 1001;
    opacity: 0;
    transition: opacity 0.4s ease;
}
.scroll-progress.visible {
    opacity: 1;
}
.scroll-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, rgba(56, 189, 248, 0.6), rgba(56, 189, 248, 0.9));
    width: 0%;
    transition: width 0.1s ease;
}

/* 分页栏 */
.pagination {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 2rem;
    padding: 0.4rem 0.75rem;
    background: rgba(22, 27, 34, 0.6);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.4s ease, transform 0.4s ease;
}
/* show: allocate layout space (display:flex) but still transparent */
.pagination.show {
    display: flex;
}
/* visible: fade + slide in */
.pagination.visible {
    opacity: 1;
    transform: translateY(0);
}
.pagination button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.95rem;
    cursor: pointer;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    transition: all 0.2s ease;
    font-weight: 500;
    white-space: nowrap;
}
.pagination button:hover:not(:disabled) {
    color: var(--text);
    background: rgba(255,255,255,0.05);
}
.pagination button.go-btn:hover:not(:disabled) {
    color: #0f1117;
    background: var(--accent);
}
.pagination button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}
.pagination button:active:not(:disabled) {
    transform: scale(0.95);
}
.page-info {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--muted);
    font-size: 0.95rem;
}
.page-input {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 500;
    padding: 0.4rem 0.5rem;
    border-radius: 8px;
    width: 3.5rem;
    text-align: center;
    -moz-appearance: textfield;
    transition: border-color 0.2s ease;
}
.page-input::-webkit-outer-spin-button,
.page-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}
.page-input:focus {
    outline: none;
    border-color: rgba(56,189,248,0.4);
}
/* 翻页进度条 */
.page-progress {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: transparent;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
}
.page-progress.visible { opacity: 1; }
.page-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, rgba(56,189,248,0.6), rgba(56,189,248,0.9));
    width: 0%;
    transition: width 0.8s ease;
    box-shadow: 0 0 8px rgba(56,189,248,0.5);
}
.page-progress-bar.instant {
    transition: width 0.15s ease;
}
/* 响应式：单列布局 + 模态窗口适配 */
@media (max-width: 768px) {
    .project-list {
        grid-template-columns: 1fr;
    }
    .modal-container {
        max-width: 100%;
        max-height: 100vh;
        border-radius: 0;
        margin: 0;
    }
    .modal-overlay {
        padding: 0;
    }
    .modal-header {
        padding: 1rem 1.5rem;
    }
    .modal-body {
        padding: 1.5rem;
    }
    .modal-body iframe {
        min-height: 70vh;
    }
}
/* 底部邮箱 */
footer{
    max-width:1200px;
    width:100%;
    margin:4rem auto 2rem;
    padding:0 clamp(1rem,5vw,4rem);
    color:var(--muted);
    position: relative;
    z-index: 1;
}
footer a{
    color:var(--accent);
    text-decoration:none;
}
</style>
</head>
<body>
<nav>
    <div class="nav-content">
        <div class="nav-brand">
            <span class="brand-name">Wayne</span>
            <span class="brand-subtitle" data-i18n="brand.sub">/ 技术美术&amp;客户端开发</span>
        </div>
        <div class="nav-right">
            <div class="nav-filter">
                <button data-filter="work" class="active" data-i18n="nav.work">作品</button>
                <button data-filter="demo" data-i18n="nav.demo">Demo</button>
            </div>
            <div class="lang-switch">
                <button data-lang="en" class="active">EN</button>
                <button data-lang="zh">中</button>
            </div>
        </div>
    </div>
</nav>

<main class="container">
    <!-- 分类大标题 -->
    <h2 class="category-title" id="categoryTitle" data-i18n="nav.work">作品</h2>

    <div class="project-list" id="projectList">
        <!-- 项目将从 projects.json 动态加载 -->
    </div>
    <!-- 分页栏 -->
    <div class="pagination" id="pagination">
        <button id="pagePrev" data-i18n="page.prev">← Prev</button>
        <div class="page-info">
            <input class="page-input" id="pageInput" type="number" value="1" min="1">
            <span>/</span>
            <span id="pageTotalEl">1</span>
        </div>
        <button class="go-btn" id="pageGo" data-i18n="page.go">Go</button>
        <button id="pageNext" data-i18n="page.next">Next →</button>
    </div>
</main>

<footer>
    <div style="display: flex; gap: 2rem; align-items: center; padding-top: 1rem; border-top: 1px solid rgba(255, 255, 255, 0.08);">
        <a href="#" id="aboutLink" style="color: var(--accent); text-decoration: none; font-weight: 500; transition: all 0.2s ease;" data-i18n="footer.about">关于我/联系我</a>
        <span>© 2026 Wayne | Technical Artist &amp; Client Developer</span>
    </div>
</footer>

<!-- 模态窗口 -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-container">
        <div class="modal-header">
            <h2 class="modal-title" id="modalTitle" data-i18n="modal.detail">项目详情</h2>
            <button class="modal-close" id="modalClose">&times;</button>
        </div>
        <div class="modal-body" id="modalBody">
            <!-- 加载动画容器 -->
            <div class="loading-container" id="loadingContainer">
                <!-- 这里会动态插入进度环或旋转环 -->
            </div>
            <iframe id="modalIframe" src=""></iframe>
        </div>
    </div>
</div>

<!-- 翻页线状进度条 -->
<div class="page-progress" id="pageProgress">
    <div class="page-progress-bar" id="pageProgressBar"></div>
</div>

<!-- 首次访问语言选择弹窗 -->
<div class="lang-modal-overlay" id="langModal">
    <div class="lang-modal">
        <h3 data-i18n="lang.title">Choose Language / 选择语言</h3>
        <p data-i18n="lang.desc">Please select your preferred language. Your choice will be saved on this device.<br>请选择您偏好的语言，选择将保存在本机。</p>
        <div class="lang-modal-btns">
            <button data-lang="en">English</button>
            <button data-lang="zh">中文</button>
        </div>
    </div>
</div>

<script>
// ============ 多语言 i18n ============
const I18N = {
    en: {
        "brand.sub": "/ Technical Artist & Client Developer",
        "nav.work": "Works",
        "nav.demo": "Demo",
        "footer.about": "About / Contact",
        "modal.detail": "Project Details",
        "modal.about": "About / Contact",
        "empty.title": "Nothing here yet",
        "empty.desc": "No projects in this category yet.",
        "loading": "Loading...",
        "loadfail": "Failed to load",
        "lang.title": "Choose Language",
        "lang.desc": "Please select your preferred language. Your choice will be saved on this device.",
        "page.prev": "← Prev",
        "page.next": "Next →",
        "page.go": "Go"
    },
    zh: {
        "brand.sub": "/ 技术美术&客户端开发",
        "nav.work": "作品",
        "nav.demo": "Demo",
        "footer.about": "关于我/联系我",
        "modal.detail": "项目详情",
        "modal.about": "关于我/联系我",
        "empty.title": "暂无内容",
        "empty.desc": "该分类下还没有项目",
        "loading": "加载中...",
        "loadfail": "加载失败",
        "lang.title": "选择语言",
        "lang.desc": "请选择您偏好的语言，选择将保存在本机。",
        "page.prev": "← 上一页",
        "page.next": "下一页 →",
        "page.go": "跳转"
    }
};

// ============ 项目数据加载 ============
let projectsData = [];
let tagTranslations = {};
let loadController = null;
let renderGen = 0;
let pageSize = 10;
let currentFilter = 'work';
let currentPages = { work: 1, demo: 1 };

async function loadProjects() {
    if (loadController) loadController.abort();
    const controller = new AbortController();
    loadController = controller;
    try {
        const response = await fetch('./projects.json', { signal: controller.signal });
        if (!response.ok) throw new Error('Failed to load projects.json');
        const data = await response.json();
        projectsData = data.projects;
        tagTranslations = data.tagTranslations;
        pageSize = (data.config && typeof data.config.pageSize === 'number' && data.config.pageSize > 0)
            ? data.config.pageSize : 10;
        renderPage(currentFilter, 1);
    } catch (error) {
        if (error.name === 'AbortError') return;
        console.error('Error loading projects:', error);
        projectList.innerHTML = '<div class="empty-state"><h3>Failed to load projects</h3><p>Please check the console for details.</p></div>';
    }
}

// 构建单个项目卡片元素并返回（不插入 DOM）
function buildProjectItem(project) {
    const item = document.createElement('div');
    item.className = 'project-item hidden';
    item.dataset.category = project.category;

    const tagsHtml = project.tags.map(tagKey => {
        const tagText = tagTranslations[tagKey]?.[currentLang] || tagKey;
        return `<span class="tag">${tagText}</span>`;
    }).join('');

    const title = project.title[currentLang] || project.title.zh;
    const desc = project.desc[currentLang] || project.desc.zh;

    const images = Array.isArray(project.images) && project.images.length > 0
        ? project.images.slice(0, 9) : [project.image];
    const n = images.length;
    const gridClass = n === 1 ? 'grid-1' : n === 2 ? 'grid-2' : n <= 4 ? 'grid-4' : 'grid-9';
    const gridCapacity = n === 1 ? 1 : n === 2 ? 2 : n <= 4 ? 4 : 9;
    const cellsHtml = images.map(src =>
        `<div class="project-image-cell"><img class="project-image" loading="lazy" src="${src}" alt="项目截图"></div>`
    ).join('');
    const placeholders = Array.from({ length: gridCapacity - n }, () =>
        `<div class="project-image-cell empty"></div>`
    ).join('');

    const zoomDelay = (typeof project.zoomDelay === 'number' && project.zoomDelay >= 0)
        ? project.zoomDelay : 0.5;
    item.dataset.zoomDelay = zoomDelay;

    // 单图卡片不需要放大覆盖层（本身已铺满），多图卡片加 overlay 供悬停放大
    const overlayHtml = n > 1 ? '<div class="zoom-overlay"><img class="zoom-overlay-img" /></div>' : '';

    item.innerHTML = `
        <a href="${project.url}">
            <div class="project-image-wrapper">
                <div class="project-tags">${tagsHtml}</div>
                <div class="image-grid ${gridClass}">${cellsHtml}${placeholders}</div>
                ${overlayHtml}
            </div>
            <div class="project-content">
                <h3 class="project-title">${title}</h3>
                <p class="project-desc">${desc}</p>
            </div>
        </a>
    `;

    item.querySelectorAll('.image-grid img').forEach(img => {
        const markReady = () => img.classList.add('img-ready');
        if (img.complete && img.naturalWidth > 0) {
            markReady();
        } else {
            img.addEventListener('load', markReady, { once: true });
            img.addEventListener('error', () => {
                const retry = new Image();
                retry.onload = () => { img.src = img.src; markReady(); };
                retry.onerror = () => markReady();
                retry.src = img.src;
                setTimeout(markReady, 2000);
            }, { once: true });
        }
        if (img.decode) img.decode().catch(() => {});
    });

    bindHoverZoom(item, zoomDelay);
    return item;
}

// 每卡片独立的延时悬停放大：
// 停在某格 zoomDelay 秒后，wrapper 上的覆盖层 fade in 显示该格完整图片；
// 切换格时若已放大则立即换图（无需重新等待）；移出卡片则 fade out。
// 空格（.empty）不绑定事件。
function bindHoverZoom(item, zoomDelay) {
    const wrapper = item.querySelector('.project-image-wrapper');
    const overlay = wrapper.querySelector('.zoom-overlay');
    // 单图卡片无 overlay，直接跳过
    if (!overlay) return;
    const overlayImg = overlay.querySelector('.zoom-overlay-img');
    let timer = null;

    const clearZoom = () => {
        if (timer !== null) { clearTimeout(timer); timer = null; }
        overlay.classList.remove('active');
    };

    // 只对有图片的格绑定，空格排除
    const cells = item.querySelectorAll('.project-image-cell:not(.empty)');
    cells.forEach(cell => {
        const cellImg = cell.querySelector('img');
        cell.addEventListener('mouseenter', () => {
            if (timer !== null) { clearTimeout(timer); timer = null; }
            if (overlay.classList.contains('active')) {
                // 已在放大状态，直接切换图片，无需重新等待
                if (cellImg) overlayImg.src = cellImg.src;
            } else {
                // 重新计时，停留够 zoomDelay 才放大
                timer = setTimeout(() => {
                    if (cellImg) overlayImg.src = cellImg.src;
                    overlay.classList.add('active');
                    timer = null;
                }, zoomDelay * 1000);
            }
        });
    });

    item.addEventListener('mouseleave', clearZoom);
}

// 自动检测浏览器语言，中文浏览器默认中文，其他默认英文
let browserLang = navigator.language || navigator.userLanguage;
let currentLang = localStorage.getItem('lang') || (browserLang.startsWith('zh') ? 'zh' : 'en');

function applyLang(lang) {
    // UX1：已在该语言时再点不触发重渲染，仅保留按压动效（初始化调用不受影响：此时数据未加载）
    if (projectsData.length > 0 && currentLang === lang) return;
    currentLang = lang;
    localStorage.setItem('lang', lang);
    document.documentElement.lang = lang;
    const dict = I18N[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (dict[key] !== undefined) el.textContent = dict[key];
    });
    // 语言按钮高亮
    document.querySelectorAll('.lang-switch button').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === lang);
    });
    // 筛选标题
    titleMap.work = dict['nav.work'];
    titleMap.demo = dict['nav.demo'];
    categoryTitleEl.textContent = dict['nav.work'];

    // UX2：打断在途的旧批次——作废所有待揭示回调与旧渲染代际，先清场再按新选择重建
    renderGen++;
    clearRevealTimers();
    filterGen++;

    if (projectsData.length > 0) {
        renderPage(currentFilter, currentPages[currentFilter]);
    }
}

// 映射filter和显示标题
const titleMap = {
    work: "作品",
    demo: "Demo"
};
const filterBtns = document.querySelectorAll('.nav-filter button');
const categoryTitleEl = document.getElementById('categoryTitle');
const projectList = document.getElementById('projectList');

// 模态窗口相关元素
const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalIframe = document.getElementById('modalIframe');
const modalClose = document.getElementById('modalClose');
const loadingContainer = document.getElementById('loadingContainer');

// 创建进度环 SVG（带进度）
function createProgressRing() {
    return `
        <div class="loading-ring">
            <svg viewBox="0 0 88 88">
                <circle class="loading-ring-bg" cx="44" cy="44" r="40"></circle>
                <circle class="loading-ring-progress" cx="44" cy="44" r="40" id="progressCircle"></circle>
            </svg>
        </div>
        <div class="loading-text">${I18N[currentLang]['loading']}</div>
    `;
}

// 创建旋转环 SVG（无进度）
function createSpinnerRing() {
    return `
        <div class="loading-spinner">
            <svg viewBox="0 0 50 50">
                <circle class="loading-spinner-circle" cx="25" cy="25" r="20"></circle>
            </svg>
        </div>
        <div class="loading-text">${I18N[currentLang]['loading']}</div>
    `;
}

// 更新进度环
function updateProgress(percent) {
    const circle = document.getElementById('progressCircle');
    if (circle) {
        const offset = 251.2 - (251.2 * percent) / 100;
        circle.style.strokeDashoffset = offset;
    }
}

// 显示加载动画
function showLoading(hasProgress = false) {
    loadingContainer.innerHTML = hasProgress ? createProgressRing() : createSpinnerRing();
    loadingContainer.classList.remove('hidden');
    modalIframe.classList.remove('loaded');
}

// 隐藏加载动画
function hideLoading() {
    loadingContainer.classList.add('hidden');
    modalIframe.classList.add('loaded');
}

// 打开模态窗口
function openModal(title, url) {
    modalTitle.textContent = title;
    modalOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';

    // 显示加载动画（默认无进度的旋转环）
    showLoading(false);

    // 设置 iframe 源
    modalIframe.src = url;

    // 监听 iframe 加载完成
    modalIframe.onload = () => {
        // 延迟隐藏加载动画，让动画更流畅
        setTimeout(() => {
            hideLoading();
        }, 300);
    };

    // 监听 iframe 加载错误
    modalIframe.onerror = () => {
        loadingContainer.innerHTML = `
            <div class="loading-text" style="color: #f87171;">${I18N[currentLang]['loadfail']}</div>
        `;
        setTimeout(() => {
            hideLoading();
        }, 1500);
    };
}

// 关闭模态窗口
function closeModal() {
    modalOverlay.classList.remove('active');
    modalIframe.src = ''; // 清空 iframe
    modalIframe.onload = null;
    modalIframe.onerror = null;
    document.body.style.overflow = ''; // 恢复滚动
    loadingContainer.classList.add('hidden');
}

// 点击关闭按钮
modalClose.onclick = closeModal;

// 点击遮罩层关闭
modalOverlay.onclick = (e) => {
    if (e.target === modalOverlay) {
        closeModal();
    }
};

// ESC 键关闭
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
        closeModal();
    }
});

// 筛选代际与集中定时器
let filterGen = 0;
let revealTimers = [];

function clearRevealTimers() {
    revealTimers.forEach(t => clearTimeout(t));
    revealTimers = [];
}

// 翻页线状进度条
let progressEndTimer = null;
function showPageProgress() {
    if (progressEndTimer) { clearTimeout(progressEndTimer); progressEndTimer = null; }
    const bar = document.getElementById('pageProgressBar');
    const wrap = document.getElementById('pageProgress');
    bar.classList.remove('instant');
    bar.style.width = '0%';
    wrap.classList.add('visible');
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = '75%'; }));
}
function hidePageProgress() {
    const bar = document.getElementById('pageProgressBar');
    const wrap = document.getElementById('pageProgress');
    bar.classList.add('instant');
    bar.style.width = '100%';
    progressEndTimer = setTimeout(() => {
        wrap.classList.remove('visible');
        setTimeout(() => { bar.classList.remove('instant'); bar.style.width = '0%'; }, 300);
        progressEndTimer = null;
    }, 200);
}

// 分页栏显示/隐藏
let paginationHideTimer = null;
function hidePagination() {
    if (paginationHideTimer) { clearTimeout(paginationHideTimer); paginationHideTimer = null; }
    const el = document.getElementById('pagination');
    // 和卡片一样立即消失，不做淡出过渡
    el.classList.remove('visible');
    el.classList.remove('show');
}
function showPaginationFadeIn() {
    if (paginationHideTimer) { clearTimeout(paginationHideTimer); paginationHideTimer = null; }
    const el = document.getElementById('pagination');
    el.classList.remove('visible');
    el.classList.add('show');
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
}

// 更新分页 UI（只更新数据和按钮状态，不控制可见性）
function updatePaginationUI(page, totalPages) {
    document.getElementById('pageInput').value = page;
    document.getElementById('pageTotalEl').textContent = totalPages;
    document.getElementById('pagePrev').disabled = page <= 1;
    document.getElementById('pageNext').disabled = page >= totalPages;
    // 同步分页按钮 i18n 文字
    document.getElementById('pagePrev').textContent = I18N[currentLang]['page.prev'];
    document.getElementById('pageNext').textContent = I18N[currentLang]['page.next'];
    document.getElementById('pageGo').textContent  = I18N[currentLang]['page.go'];
}

// 渲染指定分类的指定页
function renderPage(type, page) {
    renderGen++;
    filterGen++;
    const myGen = filterGen;
    clearRevealTimers();

    const allForType = projectsData.filter(p => p.category === type);
    const totalPages = Math.max(1, Math.ceil(allForType.length / pageSize));
    page = Math.max(1, Math.min(page, totalPages));
    currentPages[type] = page;
    currentFilter = type;
    const pageItems = allForType.slice((page - 1) * pageSize, page * pageSize);

    // 数字提前更新：分页栏消失前先把新页码写入，淡入时不会跳变
    updatePaginationUI(page, totalPages);
    // 卡片和分页栏立即消失，之后再同步淡入
    projectList.innerHTML = '';
    hidePagination();

    if (pageItems.length === 0) {
        const emptyState = document.createElement('div');
        emptyState.className = 'empty-state';
        emptyState.innerHTML = `<h3>${I18N[currentLang]['empty.title']}</h3><p>${I18N[currentLang]['empty.desc']}</p>`;
        projectList.appendChild(emptyState);
        return;
    }

    showPageProgress();
    const fragment = document.createDocumentFragment();
    pageItems.forEach(project => fragment.appendChild(buildProjectItem(project)));
    projectList.appendChild(fragment);

    const items = [...projectList.querySelectorAll('.project-item')];
    let revealedCount = 0;
    const outer = setTimeout(() => {
        if (myGen !== filterGen) return;
        items.forEach((item, index) => {
            const t = setTimeout(() => {
                if (myGen !== filterGen) return;
                const gates = [...item.querySelectorAll('.image-grid img')].map(img => {
                    if (img.complete && img.naturalWidth > 0) {
                        img.classList.add('img-ready');
                        return Promise.resolve();
                    }
                    return new Promise(res => {
                        const done = () => { img.classList.add('img-ready'); res(); };
                        img.addEventListener('load', done, { once: true });
                        img.addEventListener('error', () => setTimeout(done, 1500), { once: true });
                    });
                });
                Promise.race([
                    Promise.all(gates),
                    new Promise(res => setTimeout(res, 2500))
                ]).then(() => {
                    if (myGen !== filterGen) return;
                    item.classList.remove('hidden');
                    void item.offsetWidth;
                    item.classList.add('fade-in');
                    revealedCount++;
                    if (revealedCount === items.length) {
                        hidePageProgress();
                        // 所有卡片就绪后再淡入分页栏
                        if (totalPages > 1) showPaginationFadeIn();
                    }
                });
            }, index * 80);
            revealTimers.push(t);
        });
    }, 200);
    revealTimers.push(outer);
}

filterBtns.forEach(btn => {
    btn.onclick = () => {
        if (btn.classList.contains('active')) return;
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const type = btn.dataset.filter;
        currentPages[type] = 1;
        renderPage(type, 1);
    };
});

// 分页按钮事件
document.getElementById('pagePrev').onclick = () => {
    renderPage(currentFilter, currentPages[currentFilter] - 1);
};
document.getElementById('pageNext').onclick = () => {
    renderPage(currentFilter, currentPages[currentFilter] + 1);
};
document.getElementById('pageGo').onclick = () => {
    const val = parseInt(document.getElementById('pageInput').value, 10);
    const rawPage = isNaN(val) ? 1 : val;
    const allForType = projectsData.filter(p => p.category === currentFilter);
    const totalPages = Math.max(1, Math.ceil(allForType.length / pageSize));
    const targetPage = Math.max(1, Math.min(rawPage, totalPages));
    if (targetPage === currentPages[currentFilter]) return;
    renderPage(currentFilter, rawPage);
};
document.getElementById('pageInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('pageGo').click();
});

// 卡片点击委托（取代逐卡 bindProjectClickEvents）
projectList.addEventListener('click', e => {
    const item = e.target.closest('.project-item');
    if (!item) return;
    e.preventDefault();
    const link = item.querySelector('a');
    const title = item.querySelector('.project-title').textContent;
    const url = link.getAttribute('href');
    openModal(title, url);
});

// 处理"关于我/联系我"链接
document.getElementById('aboutLink').onclick = (e) => {
    e.preventDefault();
    openModal(I18N[currentLang]['modal.about'], './unity_ta.html');
};

// ============ 语言切换 & 首次访问弹窗 ============
const langModal = document.getElementById('langModal');
document.querySelectorAll('.lang-switch button').forEach(btn => {
    btn.onclick = () => {
        // UX1：已是当前语言则不重渲染
        if (currentLang === btn.dataset.lang) return;
        applyLang(btn.dataset.lang);
    };
});
langModal.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
        if (currentLang === btn.dataset.lang) {
            langModal.classList.remove('active');
            return;
        }
        applyLang(btn.dataset.lang);
        langModal.classList.remove('active');
    };
});

// 初始化：直接应用语言设置
applyLang(currentLang);

// 加载项目数据
loadProjects();
</script>
</body>
</html>
