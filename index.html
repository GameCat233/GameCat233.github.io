<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wayne | Technical Artist</title>
<style>
:root{
    --bg:#0f1117;
    --text:#e6edf3;
    --muted:#8b949e;
    --accent:#38bdf8;
    --card-bg:#161b22;
    --border:#30363d;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
}
html, body {
    min-height: 100%;
    display: flex;
    flex-direction: column;
}
body{
    background-color:var(--bg);
    background-image: url('./bg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color:var(--text);
    line-height:1.6;
    flex: 1;
    position: relative;
}
body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(15, 17, 23, 0.85);
    backdrop-filter: blur(40px) saturate(120%);
    -webkit-backdrop-filter: blur(40px) saturate(120%);
    z-index: -1;
}
/* 导航栏 */
nav{
    position:fixed;
    top:0;
    left:0;
    right:0;
    background:rgba(15,17,23,0.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom:1px solid rgba(255, 255, 255, 0.08);
    z-index:100;
    padding:1rem clamp(1rem,5vw,4rem);
}
.nav-content{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.nav-brand{
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
}
.brand-name{
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text);
}
.brand-subtitle{
    font-size: 1rem;
    font-weight: 400;
    color: var(--muted);
}
.nav-filter{
    display:flex;
    gap:0.5rem;
    background:rgba(22, 27, 34, 0.6);
    padding:0.25rem;
    border-radius:12px;
}
.nav-filter button{
    background:none;
    border:none;
    color:var(--muted);
    font-size:0.95rem;
    cursor:pointer;
    padding:0.5rem 1.25rem;
    border-radius:8px;
    transition:all 0.2s ease;
    font-weight:500;
}
.nav-filter button:hover{
    color:var(--text);
    background:rgba(255,255,255,0.05);
}
.nav-filter button.active{
    color:var(--text);
    background:var(--accent);
}
/* Hero 区域 */
.hero {
    display: none;
}
/* 主容器 */
.container{
    max-width:1200px;
    margin:0 auto;
    padding:6rem clamp(1rem,5vw,4rem) 4rem;
    flex: 1;
    width:100%;
    position: relative;
    z-index: 1;
}
/* 当前分类标题 */
.category-title{
    display: none;
}
/* 空状态提示 */
.empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 6rem 2rem;
    color: var(--muted);
    opacity: 0;
    animation: fadeIn 0.5s ease 0.2s forwards;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 50vh;
}
.empty-state h3 {
    font-size: 1.5rem;
    margin-bottom: 0.5rem;
    color: var(--text);
}
@keyframes fadeIn {
    to {
        opacity: 1;
    }
}
/* 项目列表 - 2列网格布局 */
.project-list{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.5rem;
}
/* 项目卡片 - 上下布局（图片在上，文字在下）- 苹果风格玻璃态 */
.project-item {
    background: rgba(22, 27, 34, 0.6);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 1;
    transform: translateY(0);
    position: relative;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
}
.project-item:hover {
    transform: translateY(-4px);
    border-color: rgba(56, 189, 248, 0.3);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(56, 189, 248, 0.1);
    background: rgba(22, 27, 34, 0.8);
}
.project-item::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 60px;
    background: linear-gradient(to bottom, transparent 0%, rgba(15,17,23,0.85) 100%);
    pointer-events: none;
    border-radius: 0 0 16px 16px;
    z-index: 1;
}
.project-item.hidden {
    opacity: 0;
    transform: translateY(-20px);
    pointer-events: none;
    height: 0;
    margin: 0;
    padding: 0;
    overflow: hidden;
}
.project-item.fade-in {
    animation: fadeInUp 0.5s ease forwards;
}
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
.project-item a {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    width: 100%;
    height: 100%;
}
.project-image-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16/10;
    overflow: hidden;
    background: var(--card-bg);
    flex-shrink: 0;
}
.project-image-wrapper::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 50%;
    background: linear-gradient(to bottom, transparent 0%, rgba(22, 27, 34, 0.6) 100%);
    pointer-events: none;
}
/* 项目标签 */
.project-tags {
    position: absolute;
    top: 1rem;
    left: 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    z-index: 2;
}
.project-tags .tag {
    padding: 0.35rem 0.75rem;
    background: rgba(22, 27, 34, 0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.02em;
}
.project-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s ease;
}
.project-item:hover .project-image {
    transform: scale(1.05);
}
.project-content {
    flex: 1;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}
.project-title {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    transition: color 0.3s ease;
}
.project-item:hover .project-title {
    color: var(--accent);
}
.project-desc {
    font-size: 0.95rem;
    color: var(--muted);
    line-height: 1.6;
}

/* 模态窗口 */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    animation: fadeIn 0.3s ease;
}
.modal-overlay.active {
    display: flex;
}
.modal-container {
    background: rgba(22, 27, 34, 0.95);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    width: 100%;
    max-width: 1000px;
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    animation: modalSlideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
}
@keyframes modalSlideIn {
    from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}
.modal-header {
    padding: 1.5rem 2rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
}
.modal-title {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--text);
}
.modal-close {
    width: 36px;
    height: 36px;
    border: none;
    background: rgba(255, 255, 255, 0.05);
    color: var(--muted);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    font-size: 1.5rem;
    line-height: 1;
}
.modal-close:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text);
}
.modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 2rem;
    position: relative;
}
.modal-body iframe {
    width: 100%;
    border: none;
    background: var(--bg);
    border-radius: 12px;
    min-height: 60vh;
    opacity: 0;
    transition: opacity 0.3s ease;
}
.modal-body iframe.loaded {
    opacity: 1;
}
/* 加载动画 */
.loading-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    z-index: 10;
    opacity: 1;
    transition: opacity 0.3s ease;
}
.loading-container.hidden {
    opacity: 0;
    pointer-events: none;
}
/* 圆形进度环 */
.loading-ring {
    width: 80px;
    height: 80px;
    position: relative;
    animation: breathe 2s ease-in-out infinite;
}
@keyframes breathe {
    0%, 100% {
        transform: scale(1);
        opacity: 1;
    }
    50% {
        transform: scale(1.1);
        opacity: 0.8;
    }
}
.loading-ring svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}
.loading-ring-bg {
    fill: none;
    stroke: rgba(56, 189, 248, 0.1);
    stroke-width: 4;
}
.loading-ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 251.2; /* 2 * PI * 40 */
    stroke-dashoffset: 251.2;
    transition: stroke-dashoffset 0.3s ease;
    filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
}
/* 无进度时的旋转环 */
.loading-spinner {
    width: 80px;
    height: 80px;
    position: relative;
    animation: breathe 2s ease-in-out infinite;
}
.loading-spinner svg {
    width: 100%;
    height: 100%;
    animation: rotate 2s linear infinite;
}
@keyframes rotate {
    100% {
        transform: rotate(360deg);
    }
}
.loading-spinner-circle {
    fill: none;
    stroke: var(--accent);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 80, 200;
    stroke-dashoffset: 0;
    filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
}
/* 加载文字 */
.loading-text {
    color: var(--accent);
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
    0%, 100% {
        opacity: 1;
    }
    50% {
        opacity: 0.5;
    }
}
/* 隐藏默认滚动条 */
.modal-body::-webkit-scrollbar {
    display: none;
}
.modal-body {
    -ms-overflow-style: none;
    scrollbar-width: none;
}
/* 自定义进度条 */
.scroll-progress {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: rgba(255, 255, 255, 0.05);
    z-index: 1001;
    opacity: 0;
    transition: opacity 0.4s ease;
}
.scroll-progress.visible {
    opacity: 1;
}
.scroll-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, rgba(56, 189, 248, 0.6), rgba(56, 189, 248, 0.9));
    width: 0%;
    transition: width 0.1s ease;
}

/* 响应式：单列布局 + 模态窗口适配 */
@media (max-width: 768px) {
    .project-list {
        grid-template-columns: 1fr;
    }
    .modal-container {
        max-width: 100%;
        max-height: 100vh;
        border-radius: 0;
        margin: 0;
    }
    .modal-overlay {
        padding: 0;
    }
    .modal-header {
        padding: 1rem 1.5rem;
    }
    .modal-body {
        padding: 1.5rem;
    }
    .modal-body iframe {
        min-height: 70vh;
    }
}
/* 底部邮箱 */
footer{
    max-width:1200px;
    width:100%;
    margin:4rem auto 2rem;
    padding:0 clamp(1rem,5vw,4rem);
    color:var(--muted);
    position: relative;
    z-index: 1;
}
footer a{
    color:var(--accent);
    text-decoration:none;
}
</style>
</head>

<script>
// 映射filter和显示标题
const titleMap = {
    work: "作品",
    demo: "Demo"
};
const filterBtns = document.querySelectorAll('.nav-filter button');
const projectItems = document.querySelectorAll('.project-item');
const categoryTitleEl = document.getElementById('categoryTitle');
const projectList = document.getElementById('projectList');

// 模态窗口相关元素
const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalIframe = document.getElementById('modalIframe');
const modalClose = document.getElementById('modalClose');
const loadingContainer = document.getElementById('loadingContainer');

// 创建进度环 SVG（带进度）
function createProgressRing() {
    return `
        <div class="loading-ring">
            <svg viewBox="0 0 88 88">
                <circle class="loading-ring-bg" cx="44" cy="44" r="40"></circle>
                <circle class="loading-ring-progress" cx="44" cy="44" r="40" id="progressCircle"></circle>
            </svg>
        </div>
        <div class="loading-text">加载中...</div>
    `;
}

// 创建旋转环 SVG（无进度）
function createSpinnerRing() {
    return `
        <div class="loading-spinner">
            <svg viewBox="0 0 50 50">
                <circle class="loading-spinner-circle" cx="25" cy="25" r="20"></circle>
            </svg>
        </div>
        <div class="loading-text">加载中...</div>
    `;
}

// 更新进度环
function updateProgress(percent) {
    const circle = document.getElementById('progressCircle');
    if (circle) {
        const offset = 251.2 - (251.2 * percent) / 100;
        circle.style.strokeDashoffset = offset;
    }
}

// 显示加载动画
function showLoading(hasProgress = false) {
    loadingContainer.innerHTML = hasProgress ? createProgressRing() : createSpinnerRing();
    loadingContainer.classList.remove('hidden');
    modalIframe.classList.remove('loaded');
}

// 隐藏加载动画
function hideLoading() {
    loadingContainer.classList.add('hidden');
    modalIframe.classList.add('loaded');
}

// 打开模态窗口
function openModal(title, url) {
    modalTitle.textContent = title;
    modalOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';

    // 显示加载动画（默认无进度的旋转环）
    showLoading(false);

    // 设置 iframe 源
    modalIframe.src = url;

    // 监听 iframe 加载完成
    modalIframe.onload = () => {
        // 延迟隐藏加载动画，让动画更流畅
        setTimeout(() => {
            hideLoading();
        }, 300);
    };

    // 监听 iframe 加载错误
    modalIframe.onerror = () => {
        loadingContainer.innerHTML = `
            <div class="loading-text" style="color: #f87171;">加载失败</div>
        `;
        setTimeout(() => {
            hideLoading();
        }, 1500);
    };
}

// 关闭模态窗口
function closeModal() {
    modalOverlay.classList.remove('active');
    modalIframe.src = ''; // 清空 iframe
    modalIframe.onload = null;
    modalIframe.onerror = null;
    document.body.style.overflow = ''; // 恢复滚动
    loadingContainer.classList.add('hidden');
}

// 点击关闭按钮
modalClose.onclick = closeModal;

// 点击遮罩层关闭
modalOverlay.onclick = (e) => {
    if (e.target === modalOverlay) {
        closeModal();
    }
};

// ESC 键关闭
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
        closeModal();
    }
});

// 拦截项目卡片点击，改为打开模态窗口
projectItems.forEach(item => {
    const link = item.querySelector('a');
    const title = item.querySelector('.project-title').textContent;
    const url = link.getAttribute('href');

    link.onclick = (e) => {
        e.preventDefault();
        openModal(title, url);
    };
});

filterBtns.forEach(btn => {
    btn.onclick = () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const type = btn.dataset.filter;

        // 更新大标题
        categoryTitleEl.style.opacity = '0';
        setTimeout(() => {
            categoryTitleEl.innerText = titleMap[type];
            categoryTitleEl.style.opacity = '1';
        }, 150);

        // 先隐藏所有项目
        projectItems.forEach(item => {
            item.classList.remove('fade-in');
            item.classList.add('hidden');
        });

        // 检查是否有匹配的项目
        const visibleItems = Array.from(projectItems).filter(item => item.dataset.category === type);

        // 移除之前的空状态
        const existingEmpty = projectList.querySelector('.empty-state');
        if (existingEmpty) {
            existingEmpty.remove();
        }

        if (visibleItems.length === 0) {
            // 显示空状态
            const emptyState = document.createElement('div');
            emptyState.className = 'empty-state';
            emptyState.innerHTML = '<h3>暂无内容</h3><p>该分类下还没有项目</p>';
            projectList.appendChild(emptyState);
        } else {
            // 延迟显示匹配的项目，带淡入动画
            setTimeout(() => {
                visibleItems.forEach((item, index) => {
                    setTimeout(() => {
                        item.classList.remove('hidden');
                        item.classList.add('fade-in');
                    }, index * 80);
                });
            }, 200);
        }
    };
});
</script>
</body>
</html>
