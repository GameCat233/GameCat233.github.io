<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wayne | Technical Artist</title>
<style>
:root{
    --bg:#0f1117;
    --text:#e6edf3;
    --muted:#8b949e;
    --accent:#38bdf8;
    --card-bg:#161b22;
    --border:#30363d;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
}
html, body {
    min-height: 100%;
    display: flex;
    flex-direction: column;
}
body{
    background-color:var(--bg);
    color:var(--text);
    line-height:1.6;
    flex: 1;
}
/* 导航栏 */
nav{
    position:sticky;
    top:0;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    z-index:10;
    padding:1.5rem clamp(1rem,5vw,4rem);
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.nav-name{
    font-size:1.25rem;
    font-weight:600;
    color:var(--text);
    text-decoration:none;
}
.nav-filter{
    display:flex;
    gap:1.5rem;
}
.nav-filter button{
    background:none;
    border:none;
    color:var(--muted);
    font-size:1rem;
    cursor:pointer;
    transition:.2s;
}
.nav-filter button:hover,
.nav-filter button.active{
    color:var(--accent);
}
/* 主容器 */
.container{
    max-width:1200px;
    margin:0 auto;
    padding:3rem clamp(1rem,5vw,4rem);
    flex: 1;
    width:100%;
    position: relative;
    z-index: 1;
}
/* 当前分类标题 */
.category-title{
    font-size:1.8rem;
    margin-bottom:2rem;
    color:var(--text);
}
/* 卡片网格 */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:2rem;
}
.card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    transition:transform .2s ease,border-color .2s ease;
}
.card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
}
.card.hidden{
    display:none;
}
.card a{
    text-decoration:none;
    color:inherit;
    display:block;
}
.card-img{
    width:100%;
    height:180px;
    object-fit:cover;
}
.card-body{
    padding:1rem;
}
.card-title{
    font-size:1.1rem;
    margin-bottom:0.4rem;
}
.card-desc{
    font-size:0.9rem;
    color:var(--muted);
}
/* 底部邮箱 */
footer{
    max-width:1200px;
    width:100%;
    margin:4rem auto 2rem;
    padding:0 clamp(1rem,5vw,4rem);
    color:var(--muted);
    position: relative;
    z-index: 1;
}
footer a{
    color:var(--accent);
    text-decoration:none;
}
/* 星点背景 */
.star-container{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
    background: transparent;
}
@keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.7; }
}
</style>
</head>
<body>
<nav>
    <a href="./index.html" class="nav-name">Wayne</a>
    <div class="nav-filter">
        <button data-filter="all" class="active">All</button>
        <button data-filter="work">作品</button>
        <button data-filter="demo">Demo</button>
    </div>
</nav>

<main class="container">
    <!-- 分类大标题 -->
    <h2 class="category-title" id="categoryTitle">All</h2>

    <div class="grid" id="cardGrid">
        <!-- ========== 作品 Project / work ========== -->
        <div class="card" data-category="work">
            <a href="./Res/Project/SLGWorldMap/index.html">
                <img class="card-img" src="./Res/Project/SLGWorldMap/thumb.png" alt="项目截图">
                <div class="card-body">
                    <h3 class="card-title">大地图战斗渲染</h3>
                    <p class="card-desc">URP管线、合批优化、简单描边方案</p>
                </div>
            </a>
        </div>

        <div class="card" data-category="work">
            <a href="./Res/Project/AIPsd2UnityPrefab/index.html">
                <img class="card-img" src="./Res/Project/AIPsd2UnityPrefab/thumb.png" alt="项目截图">
                <div class="card-body">
                    <h3 class="card-title">AI-PSD到Unity UGUI预研</h3>
                    <p class="card-desc">PSD插件,UGUI自动生成和代码生成</p>
                </div>
            </a>
        </div>

        <!-- ========== Demo / demo ========== -->
        <!-- <div class="card" data-category="demo">
            <a href="./Res/Demo/VertexAnim/index.html">
                <img class="card-img" src="./Res/Demo/VertexAnim/thumb.jpg" alt="Demo截图">
                <div class="card-body">
                    <h3 class="card-title">顶点动画Demo</h3>
                    <p class="card-desc">GPU顶点动画、实例化渲染性能测试</p>
                </div>
            </a>
        </div> -->
    </div>
</main>

<footer>
    Contact: <a href="mailto:yourmail@example.com">wywayne@outlook.com</a>
</footer>

<script>
// 背景星点
const STAR_COUNT = 60;
const STAR_COLOR = "120, 200, 255";
function createStars() {
    const container = document.createElement("div");
    container.className = "star-container";
    for (let i = 0; i < STAR_COUNT; i++) {
        const star = document.createElement("span");
        const size = Math.random() * 1.6 + 0.4;
        const left = Math.random() * 100;
        const top = Math.random() * 100;
        const delay = Math.random() * 4;
        const duration = Math.random() * 3 + 3;
        star.style.cssText = `
            position:absolute;
            left:${left}%;top:${top}%;
            width:${size}px;height:${size}px;
            background:rgba(${STAR_COLOR},0.8);
            border-radius:50%;
            box-shadow:0 0 ${size*2}px rgba(${STAR_COLOR},0.6);
            animation:twinkle ${duration}s ease-in-out ${delay}s infinite;
        `;
        container.appendChild(star);
    }
    document.body.appendChild(container);
}
createStars();

// 映射filter和显示标题
const titleMap = {
    all: "All",
    work: "作品",
    demo: "Demo"
};
const filterBtns = document.querySelectorAll('.nav-filter button');
const cards = document.querySelectorAll('.card');
const categoryTitleEl = document.getElementById('categoryTitle');

filterBtns.forEach(btn => {
    btn.onclick = () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const type = btn.dataset.filter;
        // 更新大标题
        categoryTitleEl.innerText = titleMap[type];
        cards.forEach(card => {
            if (type === 'all' || card.dataset.category === type) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });
    };
});
</script>
</body>
</html>
