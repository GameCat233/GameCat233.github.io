<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目详情</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
:root {
  --media-max-width: 1000px;   /* 多媒体基础最大宽度，改这里统一调媒体大小 */
  --content-scale: 0.95;         /* ✅ 图文宽度系数：1=和媒体同宽，>1加宽，<1收窄 */
  --bg: #0f0f11;
  --text: #e6e6e6;
  --muted: #999;
  --accent: #7aa2f7;
  --card-bg: #18181b;
}
body {
  background-color: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  line-height: 1.6;
}
/* 顶部栏 */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 2rem clamp(1rem, 4vw, 3rem);
  max-width: var(--media-max-width);
  margin: 0 auto;
  width: 100%;
}
h1 {
  font-size: clamp(1.6rem,3vw,2.4rem);
  font-weight: 500;
}
.back-btn {
  color: var(--accent);
  text-decoration: none;
  border: 1px solid var(--accent);
  padding: 0.5rem 1rem;
  border-radius: 6px;
  transition: 0.2s ease;
}
.back-btn:hover {
  background: var(--accent);
  color: var(--bg);
}
main {
  flex: 1;
  padding: 0 clamp(1rem,4vw,3rem) 3rem;
}
/* 媒体容器（视频+缩略图） */
.media-wrap {
  max-width: var(--media-max-width);
  width: 100%;
  margin: 0 auto 2rem;
}
.video-container {
  aspect-ratio: 16 / 9;
  background: #111;
  border-radius: 8px;
  overflow: hidden;
}
.video-container iframe {
  width: 100%;
  height: 100%;
  border: none;
}
.thumb-row {
  display: flex;
  gap: 0.75rem;
  overflow-x: auto;
  padding: 1rem 0;
  scroll-snap-type: x mandatory;
}
.thumb-item {
  flex: 0 0 120px;
  height: 70px;
  border-radius: 4px;
  object-fit: cover;
  cursor: pointer;
  opacity: 0.65;
  transition: 0.2s;
  scroll-snap-align: start;
  border: 2px solid transparent;
}
.thumb-item.active {
  opacity: 1;
  border-color: var(--accent);
}
.thumb-item:hover {
  opacity: 0.9;
}
/* ✅ 图文区域，跟随scale系数 */
.content-wrap {
  max-width: calc(var(--media-max-width) * var(--content-scale));
  width: 100%;
  margin: 0 auto;
  color: #ddd;
}
.content-wrap p, .content-wrap h2, .content-wrap h3, .content-wrap ul {
  margin-bottom: 1.2rem;
}
.content-wrap h2 {
  margin-top: 2rem;
  font-size: 1.4rem;
}
.content-wrap ul {
  padding-left: 1.6rem;
}
/* 底部联系栏，一直贴在页面最下方 */
footer {
  padding: 3rem clamp(1rem,4vw,3rem);
  text-align: center;
  color: var(--muted);
  border-top: 1px solid #222;
  margin-top: auto;
}
footer a {
  color: var(--accent);
  text-decoration: none;
}
</style>
</head>
<body>
<header>
  <h1>项目标题</h1>
  <a href="../../index.html" class="back-btn">← 返回主页</a>
</header>
<main>
  <div class="media-wrap">
    <div class="video-container">
      <iframe id="mainMedia" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
    </div>
    <div class="thumb-row">
      <img class="thumb-item active" data-src="https://www.youtube.com/embed/dQw4w9WgXcQ" src="https://picsum.photos/id/237/120/70">
      <img class="thumb-item" data-src="https://www.youtube.com/embed/dQw4w9WgXcQ" src="https://picsum.photos/id/239/120/70">
      <img class="thumb-item" data-src="https://www.youtube.com/embed/dQw4w9WgXcQ" src="https://picsum.photos/id/240/120/70">
    </div>
  </div>

  <div class="content-wrap">
    <p>这里是图文混排说明，现在宽度由上面 --content-scale 控制。</p>
    <p>测试：scale=1 和视频同宽；scale=1.2 文字区域更宽；scale=0.9 收窄。</p>
    <h2>功能说明</h2>
    <ul>
      <li>外链视频iframe，默认加载第一个</li>
      <li>底部缩略图横向滑动，点击切换媒体</li>
      <li>所有容器都是响应式，小屏幕自动收缩</li>
    </ul>
  </div>
</main>
<footer>
  <p>联系我：<a href="mailto:yourmail@xxx.com">yourmail@xxx.com</a></p>
</footer>

<script>
const thumbs = document.querySelectorAll('.thumb-item');
const mainMedia = document.getElementById('mainMedia');
thumbs.forEach(thumb => {
  thumb.onclick = () => {
    thumbs.forEach(t => t.classList.remove('active'));
    thumb.classList.add('active');
    mainMedia.src = thumb.dataset.src;
  }
})
</script>
</body>
</html>
